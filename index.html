<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16142a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Office Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #16142a; --panel: #211e3a; --borde: #3a3560; --texto: #f4efe6; --tenue: #a49fc4;
      --oro: #ffd36a; --verde: #6be08a; --ambar: #ffc04a; --azul: #8fb3ff; --gris: #6d6890;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto); font: 20px/1.2 "VT323", monospace; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 2px solid var(--borde); }
    h1 { font: 700 18px "Silkscreen", monospace; margin: 0; letter-spacing: 1px; }
    #senal { margin-left: auto; font: 400 12px "Silkscreen", monospace; padding: 3px 8px; border: 2px solid currentColor; }
    #senal.vivo { color: var(--verde); } #senal.demo { color: var(--ambar); } #senal.caido { color: #ff7a7a; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
    @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
    #lienzo { width: 100%; aspect-ratio: 400 / 240; image-rendering: pixelated; display: block; border: 2px solid var(--borde); background: #000; touch-action: manipulation; cursor: pointer; }
    aside { background: var(--panel); border: 2px solid var(--borde); padding: 12px; align-self: start; }
    aside h2 { font: 700 12px "Silkscreen", monospace; color: var(--tenue); margin: 4px 0 8px; letter-spacing: 1px; }
    aside h2 + p.vacio { margin-top: 0; }
    ul { list-style: none; margin: 0 0 14px; padding: 0; }
    li { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; cursor: pointer; border: 2px solid transparent; }
    li:hover, li.sel { border-color: var(--borde); background: #2a2650; }
    li .nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .info { color: var(--tenue); font-size: 17px; }
    li.pronto { opacity: .6; }
    .punto { width: 10px; height: 10px; }
    .trabajando { background: var(--verde); } .esperando { background: var(--ambar); }
    .descanso { background: var(--azul); } .ausente { background: var(--gris); }
    .vacio { color: var(--tenue); font-size: 18px; }
    #ficha { margin-top: 16px; background: var(--panel); border: 2px solid var(--oro); padding: 12px; display: none; }
    #ficha.abierta { display: block; }
    #ficha h3 { margin: 0 0 6px; font: 700 13px "Silkscreen", monospace; color: var(--oro); }
    #ficha dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; margin: 0; }
    #ficha dt { color: var(--tenue); } #ficha dd { margin: 0; overflow-wrap: anywhere; }
    .leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--tenue); font-size: 17px; margin-top: 10px; }
    .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <header>
    <h1 id="titulo">Office Mind</h1>
    <span id="senal" class="demo">…</span>
  </header>
  <main>
    <section>
      <canvas id="lienzo" width="800" height="480" aria-label="Oficina en pixel art con las sesiones de Claude"></canvas>
      <div class="leyenda">
        <span><i class="punto trabajando"></i>trabajando</span>
        <span><i class="punto esperando"></i>te espera</span>
        <span><i class="punto descanso"></i>descanso</span>
        <span><i class="punto ausente"></i>sin sesión</span>
        <span>· transparente = se va pronto</span>
      </div>
      <div id="ficha" role="region" aria-live="polite"></div>
    </section>
    <aside>
      <h2>SUPERVISORES</h2>
      <ul id="listaSup"></ul>
      <h2 id="tituloVis">VISITANTES</h2>
      <ul id="listaVis"></ul>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>

<style>
:root{
  color-scheme:dark;
  --fondo:#17131d; --barra:#241d2c; --borde:#0c090f; --texto:#f3e9d7; --tenue:#a99a8b;
  --verde:#6fd36f; --rojo:#ff6b5b; --naranja:#d97757; --s:2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
  font-family:Consolas,"Lucida Console","Courier New",monospace;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:20px;
  padding:0 16px;background:var(--barra);border-bottom:4px solid var(--borde);font-size:14px;white-space:nowrap;z-index:5}
.titulo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:15px}
.logo{width:16px;height:16px;background:var(--naranja);box-shadow:0 0 0 2px #2a1a14,inset -3px -3px 0 #b4573a}
.senal{display:flex;align-items:center;gap:8px;color:var(--tenue)}
.senal .punto{width:10px;height:10px;background:var(--tenue)}
.senal.ok{color:var(--texto)}
.senal.ok .punto{background:var(--verde);animation:latido 1.2s steps(2,end) infinite}
.senal.mal{color:var(--rojo)}
.senal.mal .punto{background:var(--rojo)}
@keyframes latido{50%{opacity:.3}}
.derecha{margin-left:auto;display:flex;gap:20px;color:var(--tenue);overflow:hidden}
#reloj{color:var(--texto)}
#escenario{position:fixed;top:50px;left:0;right:0;bottom:0;overflow:auto;padding:12px 0 calc(56px + env(safe-area-inset-bottom,0px));
  scroll-behavior:smooth;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#zoomTip{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;
  background:rgba(23,19,29,.86);color:var(--tenue);font:12px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;padding:6px 9px;pointer-events:none}
.nombre .ultra{font-style:normal;font-weight:800;color:#0b1d4d;background:#7fe7ff;padding:0 calc(var(--s)*1px);margin-left:calc(var(--s)*1.5px);letter-spacing:.06em}
.nombre small{display:block;font-size:.82em;color:#cfe9c9;letter-spacing:.02em}
.origen{display:inline-block;font:700 11px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:1px 7px;margin-right:6px;letter-spacing:.04em}
.origen.tableta{background:#3ddc84;color:#0d2a1a}
.origen.laptop{background:#d97757;color:#1a120e}
.origen.borrado{background:#5a4a5f;color:#e9dcef}
#mundo{position:relative;margin:0 auto}
#lienzo{display:block;image-rendering:pixelated;box-shadow:0 0 0 4px var(--borde)}
#capa{position:absolute;inset:0;pointer-events:none}

/* Viñeta de cómic: blanca, borde negro de pixel, cola en escalón */
.vineta{position:absolute;left:0;top:0;background:#fff;color:#151015;font-weight:700;
  font-size:calc(max(11px,var(--s)*5.2px)*var(--t,1));line-height:1.18;text-align:center;
  padding:calc(var(--s)*1.5px*var(--t,1)) calc(var(--s)*2.5px*var(--t,1));
  width:max-content;max-width:calc(max(120px,var(--s)*88px)*var(--t,1));
  box-shadow:0 calc(var(--s)*-1px) 0 #151015,0 calc(var(--s)*1px) 0 #151015,
             calc(var(--s)*-1px) 0 0 #151015,calc(var(--s)*1px) 0 0 #151015;
  z-index:3}
body.sinTexto .vineta{display:none!important}
.vineta .cola{position:absolute;top:100%;left:0;width:calc(var(--s)*7px);height:calc(var(--s)*4px);display:block}
.vineta.pop{animation:pop .3s steps(3,end)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.vineta.puntos i{font-style:normal;animation:punto 1.2s infinite;opacity:.2}
.vineta.puntos i:nth-child(2){animation-delay:.2s}
.vineta.puntos i:nth-child(3){animation-delay:.4s}
@keyframes punto{0%,100%{opacity:.2}40%{opacity:1}}

/* Gafete con el nombre debajo de cada monito */
.nombre{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;color:#fff;
  font-size:max(9px,calc(var(--s)*3.6px));line-height:1.25;padding:0 calc(var(--s)*1.5px);
  background:rgba(18,12,18,.8);border-left:calc(var(--s)*1.5px) solid var(--c,#d97757);z-index:2}
.nombre .pips{letter-spacing:calc(var(--s)*-.3px);opacity:.95}
.nombre i{font-style:normal;font-weight:700;margin-left:calc(var(--s)*1.5px)}
.nombre .jefe{color:#ffd34d;margin-right:calc(var(--s)*1px)}
.nombre .reloj{color:#7fe7ff;margin-right:calc(var(--s)*1px)}
.pantalla{position:absolute;overflow:hidden;color:#d7f3ff;pointer-events:none;z-index:1;display:flex;flex-direction:column;gap:calc(var(--s)*.5px);
  padding:calc(var(--s)*1.5px) calc(var(--s)*2px);font-size:max(6px,calc(var(--s)*4px));line-height:1.12;font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
.pantalla b{color:#ffd34d;font-size:.8em;letter-spacing:.1em}
.pantalla #ptTitulo{font-weight:700;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pantalla #ptTexto{color:#9fc7dd;font-size:.9em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.pantalla small{color:#6f8fa5;font-size:.72em}
.viaje{position:absolute;transform:translate(-50%,-190%);white-space:nowrap;background:#12202c;color:#bfeeff;font-weight:700;
  font-size:max(8px,calc(var(--s)*3.4px));line-height:1.3;padding:calc(var(--s)*.5px) calc(var(--s)*2px);box-shadow:0 0 0 calc(var(--s)*.6px) #7fe7ff;z-index:2;pointer-events:none;display:none}
.tarjeta i.tipo{display:block;font-size:11px;letter-spacing:.08em;color:#ffd34d}
.reporte h4{margin:14px 0 2px;font-size:16px}
.reporte p{margin:6px 0}
.reporte .tarjeta a{color:#c9a6ff;word-break:break-all}
.nombre.pronto{opacity:.62}
.nombre b{display:inline-block;width:calc(var(--s)*2px);height:calc(var(--s)*2px);min-width:4px;min-height:4px;
  margin-left:calc(var(--s)*1.5px);background:var(--e,#6fd36f);vertical-align:middle}

/* Letreros de las áreas */
.letrero{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:#6b4426;color:#ffe3b8;
  font-weight:700;letter-spacing:.08em;font-size:max(9px,calc(var(--s)*4.2px));line-height:1.25;
  padding:calc(var(--s)*.8px) calc(var(--s)*2.6px);
  box-shadow:0 calc(var(--s)*-1px) 0 #2e1b0e,0 calc(var(--s)*1px) 0 #2e1b0e,
             calc(var(--s)*-1px) 0 0 #2e1b0e,calc(var(--s)*1px) 0 0 #2e1b0e,inset 0 calc(var(--s)*-1px) 0 #4e2f18;z-index:1}
.letrero.activo{background:#93602f;color:#fff8e1}
.letrero.activo::after{content:"";position:absolute;right:calc(var(--s)*-4px);top:50%;width:calc(var(--s)*2px);height:calc(var(--s)*2px);
  margin-top:calc(var(--s)*-1px);background:#7dff8a;box-shadow:0 0 0 calc(var(--s)*.5px) #1f5a2a}

.vacia{position:absolute;left:50%;top:22.1%;transform:translate(-50%,-50%);background:rgba(23,19,29,.88);color:#f3e9d7;
  font-size:max(11px,calc(var(--s)*4.6px));padding:calc(var(--s)*2px) calc(var(--s)*4px);display:none;z-index:2;white-space:nowrap}
.aviso{position:fixed;top:50px;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,14,.84);z-index:10;padding:16px}
.aviso div{max-width:560px;background:#fff;color:#151015;padding:22px 26px;font-size:16px;line-height:1.55;
  box-shadow:0 -4px 0 #151015,0 4px 0 #151015,-4px 0 0 #151015,4px 0 0 #151015}
.aviso b{color:#b4573a}
.aviso p{margin:0 0 14px}
.aviso .boton{font-size:15px;padding:9px 14px;margin:0 8px 0 0}

/* Botones para ir de piso en piso */
.pisos{display:flex;gap:6px}
.pisos button,#bajar{background:#3a2f48;color:var(--texto);border:0;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #120e17}
.pisos button:hover,#bajar:hover{background:#4a3d5c}
.pisos a{background:var(--naranja);color:#1a120e;font-weight:700;padding:5px 10px;font-size:12px;text-decoration:none;box-shadow:0 2px 0 #120e17;white-space:nowrap}
#bajar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;font-size:13px;padding:8px 14px;background:var(--naranja);color:#1a120e;font-weight:700}
#bajar.oculto{display:none}

/* Letrero que sale al pasar el mouse sobre algo que se puede picar */
#tip{position:fixed;z-index:9;pointer-events:none;background:#151015;color:#fff;font-size:12px;padding:4px 8px;display:none;
  box-shadow:0 0 0 2px #f3e9d7;white-space:nowrap}

/* Panel lateral: fichas, Cerebro Delta, proyectos, cuartos vacíos */
#panel{position:fixed;top:50px;right:0;bottom:0;width:min(420px,100vw);background:#1f1927;border-left:4px solid var(--borde);z-index:8;
  transform:translateX(105%);transition:transform .18s ease-out;display:flex;flex-direction:column;
  font-family:"Segoe UI",system-ui,sans-serif;color:var(--texto)}
#panel.abierto{transform:none}
.cabeza{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#2a2234;border-bottom:3px solid var(--borde)}
#panelTitulo{font-family:Consolas,monospace;font-weight:700;letter-spacing:1px;flex:1;font-size:15px}
.cerrar{background:#3a2f48;color:var(--texto);border:0;width:30px;height:30px;font-size:16px;cursor:pointer}
#panelCuerpo{overflow-y:auto;padding:12px 14px 28px;flex:1;font-size:14px;line-height:1.45}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pestanas button,.boton{background:#3a2f48;color:var(--texto);border:0;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;
  box-shadow:0 2px 0 #120e17;text-decoration:none;display:inline-block}
.pestanas button.activo{background:var(--naranja);color:#1a120e;font-weight:700}
.boton.principal{background:var(--naranja);color:#1a120e;font-weight:700}
.botones{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.item{display:block;box-sizing:border-box;text-decoration:none;width:100%;text-align:left;background:#2a2234;border:0;color:var(--texto);padding:8px 10px;margin:0 0 6px;cursor:pointer;font:inherit}
.item:hover{background:#352b42}
.item small,.meta{display:block;color:var(--tenue);font-size:12px;margin-top:2px}
.buscar,.campo{width:100%;padding:7px 9px;background:#120e17;border:2px solid #3a2f48;color:var(--texto);font:inherit;margin-bottom:10px}
textarea.campo{min-height:70px;resize:vertical}
.nota{white-space:pre-wrap;line-height:1.5;background:#17121d;padding:12px;margin-top:10px;word-break:break-word}
.nota a,a.enlace{color:#c9a6ff;cursor:pointer;text-decoration:underline}
.tarjeta{background:#2a2234;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--naranja)}
.tarjeta b{display:block;margin-bottom:2px}
.tarjeta div{font-size:13px;color:#d9cdbb;margin-top:3px}
.tarjeta i{font-style:normal;color:var(--tenue)}
.fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #2f2738}
.fila span:first-child{color:var(--tenue)}
.vacio{color:var(--tenue);font-style:italic}
/* Teléfono: va al final para que sí le gane a las reglas de arriba (antes el panel quedaba encimado) */
/* Tableta o ventana angosta: los botones bajan a su propio renglón para que quepan todos */
@media (max-width:1180px){
  header{height:auto;flex-wrap:wrap;gap:6px 14px;padding-top:8px;padding-bottom:8px}
  .pisos{order:3;width:100%;overflow-x:auto}
  .pisos button,.pisos a{white-space:nowrap}
}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;gap:6px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
    font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
  .titulo{font-size:14px;letter-spacing:1px}
  .derecha{display:none}
  .pisos{order:3;width:100%;overflow-x:auto}
  .pisos button,.pisos a{flex:1;font-size:13px;padding:8px 6px;white-space:nowrap;text-align:center}
  #panel{top:auto;left:0;width:100%;max-height:72vh;border-left:0;border-top:4px solid var(--borde);transform:translateY(105%);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  #panelCuerpo{font-size:15px}
  #bajar{display:none}
}
</style>
</head>

(() => {

/* =====================================================================

/* ---------- Ajustes ---------- */
const T = 16, COLS = 32;
/* El mapa se escribió con los pasillos 1 y 2 de dos casillas de ancho. Ahora son más anchos: se les agregan
   filas y todo lo de abajo se recorre. Los muebles y adornos de siempre siguen escritos con sus medidas de
   antes y se dibujan recorridos; FILA() y PY() convierten una fila o un pixel de antes a su lugar de ahora.
   Lo nuevo (el periférico y sus estaciones) ya se escribe con las medidas de ahora. */
const N1 = 2, N2 = 2, FILAS_V = 88;            // filas que gana cada pasillo · filas del mapa como se escribió
const ROWS = FILAS_V + N1 + N2, W = COLS * T, H = ROWS * T;
const FILA = r => r + (r >= 25 ? N1 + N2 : r >= 13 ? N1 : 0);
const PY = y => y + (y >= 400 ? (N1 + N2) * T : y >= 208 ? N1 * T : 0);
const FILA_V = r => r >= 25 + N1 + N2 ? r - N1 - N2 : r > 24 + N1 ? 24 : r >= 13 + N1 ? r - N1 : r > 12 ? 12 : r;   // de ahora a antes

  for (const [y0, y1, dy] of BANDAS){ g.save(); g.beginPath(); g.rect(0, y0 + dy, W, y1 - y0); g.clip(); g.translate(0, dy); pintar(); g.restore(); }
}
const FILAS_ARRIBA = 22 + N1;        // la planta principal; lo demás se ve bajando con el scroll
const SEGUNDOS_INACTIVO = 60;   // sin reportar más de esto -> Descanso
/* De dónde lee: en la laptop, estado.json del servidor local; en el teléfono (GitHub Pages),
   los archivos públicos de estado. La página nunca escribe. */
const EN_NUBE = location.protocol !== 'file:' && !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const NUBE = {
  estado: 'https://raw.githubusercontent.com/KALLEROS/oficina-cloud-monitoreo-estado/main/estado.json',
  terrazas: 'https://raw.githubusercontent.com/daniterrazas01-source/dragtrim/claude/oficina-estado/oficina/estado-terrazas.json',

/* Dentro de claude.ai (Artifact) la página lee tus sesiones de Claude Code con tu propia cuenta. */
const EN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

const CADA_SESIONES_MS = 30000; // cada cuánto se pide la lista de sesiones
const CALLADO_MIN = 10;         // un visitante con más de esto sin actividad ya no trae viñeta, solo duerme
/* Quiénes son supervisores y cuánto aguanta un visitante: config/oficina.json */
let CONFIG = { supervisores: [] };
async function cargarConfig(){
  if (EN_CLAUDE) return;          // dentro de claude.ai los supervisores se eligen en la página
  try { const c = await leerJSON('config/oficina.json'); if (c && typeof c === 'object') CONFIG = c; } catch (e) {}
}
const VELOCIDAD = 100;          // pixeles por segundo al caminar
const AVISO = 0.35;             // segundos con "!" antes de levantarse
const FPS = 30;                 // cuadros por segundo (ahorra batería)
const ENTRADA = { tx: 31, ty: 11 };
const K = '#2a1a14';            // color de contorno

const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const capa = document.getElementById('capa');
let g = ctx;                    // contexto donde se dibuja ahorita

function R(x, y, w, h, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function tono(hex, d){
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + d));
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}
function azar(sem){ let s = sem | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashTexto(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function sinAcentos(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function linea(x0, y0, x1, y1, c){
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;){ R(x0, y0, 1, 1, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy){ err += dy; x0 += sx; } if (e2 <= dx){ err += dx; y0 += sy; } }
}

function normalizarArea(a){
  const s = sinAcentos(a).toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  if (s.includes('calleros')) return 'calleros';
  if (s.includes('cerebro')) return 'cerebro delta';
  if (s.includes('terraza')) return 'terrazas';
  if (s.includes('pensado') || s.includes('pensar') || s.includes('pensamiento') || s.includes('memoria')) return 'centro de pensado';
  if (s.includes('almacen') || s.includes('archivero') || s.includes('archivo')) return 'almacen';
  if (s.includes('noticia') || s.includes('pantalla') || s.includes('cartelera')) return 'noticias';
  if (s.includes('junta') || s === 'sala' || s.includes('reunion')) return 'sala de juntas';
  if (s.startsWith('escritorio') || s === 'computadora') return 'escritorio';
  if (s.startsWith('biblio')) return 'biblioteca';
  if (s.startsWith('internet') || s === 'web') return 'internet';
  if (s.startsWith('descanso')) return 'descanso';
  return null;
}
function textoBreve(s){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const p = s.split(' ');
  let out = p.slice(0, 10).join(' ');
  if (out.length > 60) out = out.slice(0, 58).trimEnd() + '…';
  else if (p.length > 10) out += '…';
  return out;
}

const MUEBLES = [];
function mueble(sortY, dibujar){   // con medidas de antes: se dibuja recorrido a su lugar de ahora
  const base = Math.floor(sortY) - 1, dy = PY(base) - base;
  MUEBLES.push({ sortY: sortY + dy, dibujar: dy ? (t) => { g.save(); g.translate(0, dy); dibujar(t); g.restore(); } : dibujar });
}

function codigo(x, y, w, t, s){
  const cols = ['#7ee787', '#f2a283', '#79c0ff', '#e6edf3', '#d2a8ff'];
  const base = Math.floor(t * 2.5) + s * 5;
  for (let i = 0; i < 4; i++){
    const n = base + i, sang = ((n * 5) % 3) * 2, largo = 3 + ((n * 7) % (w - 5));
    R(x + sang, y + i * 2, Math.min(largo, w - sang), 1, cols[n % cols.length]);
  }
}

function escritorioMueble(tx, ty, idx, area = 'escritorio'){
  bloquear(tx, ty, tx + 1, ty);
  const cx = (tx + 1) * T, top = ty * T - 2;
  mueble(ty * T + 16, (t) => {
    R(cx - 16, top, 32, 18, K);
    R(cx - 15, top + 1, 30, 10, '#a8703f'); R(cx - 15, top + 1, 30, 1, '#c48a54');
    R(cx - 15, top + 11, 30, 6, '#7b4f2b'); R(cx - 15, top + 11, 30, 1, '#5e3b1f');
    R(cx - 12, top + 13, 6, 2, '#5e3b1f'); R(cx - 10, top + 13, 2, 1, '#d8b27a');
    const on = ocupadoLugar(area, idx);
    R(cx - 9, top - 12, 18, 12, K); R(cx - 8, top - 11, 16, 9, on ? '#10241b' : '#1e2430');
    if (on) codigo(cx - 7, top - 10, 14, t, idx); else R(cx - 7, top - 10, 2, 1, '#2f3848');
    R(cx - 1, top, 2, 2, K); R(cx - 4, top + 2, 8, 1, '#2a2a30');
    R(cx - 7, top + 5, 14, 4, K); R(cx - 6, top + 6, 12, 2, '#d9d9e0');
    for (let i = 0; i < 6; i++) R(cx - 6 + i * 2, top + 6, 1, 1, '#a3a3b2');
    if (on && Math.floor(t * 8 + idx) % 2) R(cx - 4 + (Math.floor(t * 13) % 8), top + 7, 1, 1, '#6b6b7a');
    if (idx === 0){ R(cx + 9, top + 2, 5, 6, K); R(cx + 10, top + 3, 3, 4, '#d97757'); R(cx + 14, top + 4, 1, 2, K); }
    else if (idx % 2){ R(cx - 14, top + 2, 5, 7, '#f2efe6'); R(cx - 14, top + 2, 5, 1, '#cfc8b6'); R(cx - 13, top + 4, 3, 1, '#bdb6a5'); }
    else { R(cx + 10, top + 2, 3, 3, '#3f8f3f'); R(cx + 10, top + 5, 3, 3, '#b5652d'); }
  });
}

function silla(l){
  const { x, y, dir } = l;
  const c = l.silla === 'oficina' ? '#4b5163' : l.silla === 'jefe' ? '#2a2630' : '#8d5a2e';
  const c2 = tono(c, 22), c3 = tono(c, -18);
  if (l.silla === 'jefe'){   // sillón de piel, respaldo alto
    mueble(y - 0.5, () => {
      R(x - 9, y - 19, 18, 14, K); R(x - 8, y - 18, 16, 12, c); R(x - 8, y - 18, 16, 1, c2);
      R(x - 5, y - 15, 1, 8, c2); R(x + 4, y - 15, 1, 8, c2);
      R(x - 9, y - 6, 18, 6, K); R(x - 8, y - 5, 16, 4, c3);
    });
    return;
  }
  if (dir === 'arriba'){
    mueble(y - 0.5, () => { R(x - 6, y - 8, 12, 7, K); R(x - 5, y - 7, 10, 5, c3); });
    mueble(y + 0.5, () => {
      R(x - 6, y - 2, 12, 4, K); R(x - 5, y - 1, 10, 2, c); R(x - 5, y - 1, 10, 1, c2);
      if (l.silla === 'oficina'){ R(x - 1, y + 2, 2, 1, K); R(x - 4, y + 3, 8, 1, '#2b2d35'); }
      else { R(x - 5, y + 2, 1, 1, K); R(x + 4, y + 2, 1, 1, K); }
    });
  } else if (dir === 'abajo'){
    mueble(y - 0.5, () => {
      R(x - 7, y - 14, 14, 9, K); R(x - 6, y - 13, 12, 7, c); R(x - 6, y - 13, 12, 1, c2);
      R(x - 6, y - 6, 12, 6, K); R(x - 5, y - 5, 10, 4, c3);
    });
  } else {
    const bx = dir === 'der' ? x - 10 : x + 7;
    mueble(y - 0.5, () => {
      R(bx, y - 14, 3, 14, K); R(bx + 1, y - 13, 1, 12, c2);
      R(x - 6, y - 6, 12, 6, K); R(x - 5, y - 5, 10, 4, c3);
    });
  }
}

}

function baldosa(x, y){

      R(px, py, T, T, '#463b58');

      if ((x * 7 + y * 3) % 5 === 0) R(px + 5, py + 6, 3, 1, '#3d334e');
      break;
    case '=': {
      const cc = caraDe(x, FILA_V(y));
      R(px, py, T, T, cc); R(px, py, T, 2, tono(cc, -38));
      for (let i = 2; i < T; i += 4) R(px + i, py + 3, 1, 9, tono(cc, -12));

    }
    case 'D': case 'h': case 'E':
      R(px, py, T, T, ((x + y) & 1) ? '#cbbd9c' : '#c2b391');
      R(px, py, T, 1, '#b4a583'); R(px, py, 1, T, '#b4a583');

  const clave = nombre + '|' + (a.modelo || '') + '|' + !!a.ultra + '|' + (a.dispositivo || '') + '|' + (a.rol || '') + '|' + plazo + '|' + (a.esfuerzo ? a.esfuerzo[0] : '');
  if (a.gafete === clave) return;
  a.gafete = clave; a.nombre = nombre; a.elNombre.textContent = nombre; a.medirNombre = true;
  a.elNombre.classList.toggle('pronto', !!plazo);
  if (a.rol === 'supervisor'){ const j = document.createElement('span'); j.className = 'jefe'; j.textContent = '★'; a.elNombre.prepend(j); }
  if (a.rol === 'programado'){ const j = document.createElement('span'); j.className = 'reloj'; j.textContent = '◆'; a.elNombre.prepend(j); }
  const m = MODELOS[a.modelo];
  if (m){ const i = document.createElement('i'); i.textContent = m.nombre; i.style.color = m.etiqueta; a.elNombre.appendChild(i); }
  if (a.ultra){ const u = document.createElement('span'); u.className = 'ultra'; u.textContent = 'ULTRA'; a.elNombre.appendChild(u); }
  a.elNombre.appendChild(document.createElement('b'));
  // Renglón de abajo: con qué trabaja ("Opus en alto" y sus rayitas) si se sabe; si no, en qué aparato está
  const conQue = m && a.esfuerzo ? m.nombre + ' en ' + a.esfuerzo[0] : a.tableta && m ? 'Modelo ' + m.nombre : '';
  const abajo = [conQue, !conQue || a.rol === 'programado' ? a.dispositivo : '', plazo].filter(Boolean).join(' · ');   // los de tarea programada conservan su horario
  if (abajo){
    const s = document.createElement('small'); s.textContent = abajo;
    if (conQue && a.esfuerzo){ const p = document.createElement('span'); p.className = 'pips'; p.style.color = m.etiqueta; p.textContent = ' ' + '▮'.repeat(a.esfuerzo[1]) + '▯'.repeat(5 - a.esfuerzo[1]); s.appendChild(p); }
    a.elNombre.appendChild(s);
  }
  a.elNombre.style.setProperty('--c', a.tableta ? '#3ddc84' : ASPECTOS[a.aspecto].etiqueta);
}
function ponerTexto(a, texto, pop){
  if (!texto){ a.modo = 'oculta'; return; }
  a.modo = 'texto';
  a.el.classList.remove('puntos');
  a.elTexto.textContent = texto;
  a.medir = true;
  if (pop){ a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop'); }
}
function ponerPuntos(a){
  a.modo = 'puntos'; a.el.classList.add('puntos');
  a.elTexto.innerHTML = '<i>•</i><i>•</i><i>•</i>'; a.medir = true;
}

function liberar(a){
  const l = a.lugar; if (!l) return;
  if (l.idx >= 0){ if (OCUPA[l.area][l.idx] === a.id) OCUPA[l.area][l.idx] = null; }
  else EXTRA[l.area].delete(a.id);
  a.lugar = null;
}
function asignarLugar(a, area){
  liberar(a);
  const occ = OCUPA[area], lista = LUGARES[area];
  const principal = x => x.id === 'claude' || x.id.startsWith('claude-');
  const reservarPrincipal = !principal(a) && [...agentes.values()].some(principal);
  let idx = -1;
  a.enTubo = false;
  if (a.quiereTubo){ const i = lista.findIndex(l => l.tubo); if (i >= 0 && !occ[i]){ idx = i; a.enTubo = true; } }   // va a la estación del túnel
  if (idx < 0 && principal(a) && !occ[0]) idx = 0;
  const puede = l => !l.tubo && (!l.jefe || a.rol === 'supervisor');
  for (let i = reservarPrincipal ? 1 : 0; idx < 0 && i < lista.length; i++) if (!occ[i] && puede(lista[i])) idx = i;
  if (idx < 0 && !occ[0] && puede(lista[0])) idx = 0;
  if (idx >= 0){ occ[idx] = a.id; a.lugar = lista[idx]; return; }
  const usadas = new Set([...EXTRA[area].values()].map(c => c.ty * COLS + c.tx));
  const c = CANDIDATOS[area].find(c => !usadas.has(c.ty * COLS + c.tx)) || CANDIDATOS[area][0];
  EXTRA[area].set(a.id, c);
  a.lugar = { area, idx: -1, tx: c.tx, ty: c.ty, x: c.tx * T + 8, y: c.ty * T + 13, dir: 'abajo', sentado: false, silla: null };
}

/* Camino más corto con pocas vueltas (Dijkstra con castigo por girar) */
const DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
function buscarCamino(a, b, tubo){
  if (a.x === b.x && a.y === b.y) return [a];
  const N = COLS * ROWS * 4;
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);
  const hc = [], hs = [];
  const push = (c, s) => { hc.push(c); hs.push(s); let i = hc.length - 1; while (i > 0){ const p = (i - 1) >> 1; if (hc[p] <= hc[i]) break; [hc[p], hc[i]] = [hc[i], hc[p]]; [hs[p], hs[i]] = [hs[i], hs[p]]; i = p; } };
  const pop = () => { const c = hc[0], s = hs[0], lc = hc.pop(), ls = hs.pop(); if (hc.length){ hc[0] = lc; hs[0] = ls; let i = 0; for (;;){ const l = 2 * i + 1, r = l + 1; let m = i; if (l < hc.length && hc[l] < hc[m]) m = l; if (r < hc.length && hc[r] < hc[m]) m = r; if (m === i) break; [hc[m], hc[i]] = [hc[i], hc[m]]; [hs[m], hs[i]] = [hs[i], hs[m]]; i = m; } } return [c, s]; };
  const ini = a.y * COLS + a.x, fin = b.y * COLS + b.x;
  for (let d = 0; d < 4; d++){ dist[ini * 4 + d] = 0; push(0, ini * 4 + d); }
  let mejor = -1;
  while (hc.length){
    const [c, s] = pop();
    if (c > dist[s]) continue;
    const celda = s >> 2, d = s & 3;
    if (celda === fin){ mejor = s; break; }
    const x = celda % COLS, y = (celda / COLS) | 0;
    for (let nd = 0; nd < 4; nd++){
      const nx = x + DX[nd], ny = y + DY[nd];
      if (!caminable(nx, ny)) continue;
      const ns = (ny * COLS + nx) * 4 + nd, nc = c + 10 + (nd !== d ? 5 : 0);
      if (nc < dist[ns]){ dist[ns] = nc; prev[ns] = s; push(nc, ns); }
    }
    const e0 = ESCOTILLAS[0].y * COLS + ESCOTILLAS[0].x, e1 = ESCOTILLAS[1].y * COLS + ESCOTILLAS[1].x;
    const otra = celda === e0 ? e1 : celda === e1 ? e0 : -1;
    if (otra >= 0){ const ns = otra * 4 + d, nc = c + 60; if (nc < dist[ns]){ dist[ns] = nc; prev[ns] = s; push(nc, ns); } }   // por el túnel subterráneo
    if (tubo && PIES.has(celda)) for (const [pie, clave] of PIES){                                                              // por el periférico, de estación a estación
      if (pie === celda) continue;
      const ns = pie * 4 + d, nc = c + 40 + Math.round(largoRuta(rutaTunel(PIES.get(celda), clave)) / T * 3);
      if (nc < dist[ns]){ dist[ns] = nc; prev[ns] = s; push(nc, ns); }
    }
  }
  if (mejor < 0) return [a, b];
  const celdas = [];
  for (let s = mejor; s >= 0; s = prev[s]){ const c = s >> 2; celdas.push({ x: c % COLS, y: (c / COLS) | 0 }); }
  return celdas.reverse();
}
function casillaInicio(a){
  if (a.fase === 'trabajando' && a.lugar) return { x: a.lugar.tx, y: a.lugar.ty };
  const tx = Math.max(0, Math.min(COLS - 1, Math.round((a.x - 8) / T)));
  const ty = Math.max(0, Math.min(ROWS - 1, Math.round((a.y - 13) / T)));
  if (caminable(tx, ty)) return { x: tx, y: ty };
  let mejor = { x: ENTRADA.tx, y: ENTRADA.ty }, md = 1e9;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (caminable(x, y)){
    const d = Math.hypot(x * T + 8 - a.x, y * T + 13 - a.y); if (d < md){ md = d; mejor = { x, y }; }
  }
  return mejor;
}
function construirRuta(a, inicio, lugar){
  const pts = [], c0 = { x: inicio.x * T + 8, y: inicio.y * T + 13 };
  if (Math.hypot(c0.x - a.x, c0.y - a.y) > 0.5) pts.push(c0);
  const celdas = buscarCamino(inicio, { x: lugar.tx, y: lugar.ty }, a.rol === 'supervisor' || a.rol === 'programado');   // los que nunca se van pueden usar el periférico
  for (let i = 1; i < celdas.length; i++){
    const p = celdas[i - 1], c = celdas[i], n = celdas[i + 1];
    const salto = Math.abs(c.x - p.x) + Math.abs(c.y - p.y) > 1;       // de una escotilla a la otra: ese tramo va por abajo
    const de = PIES.get(p.y * COLS + p.x), hasta = PIES.get(c.y * COLS + c.x);
    if (salto && de && hasta){                                         // de una estación a otra: va por el periférico
      for (const q of rutaTunel(de, hasta)) pts.push({ x: q.x, y: q.y, bajo: true, tubo: true });
      pts.push({ x: c.x * T + 8, y: c.y * T + 13, bajo: true, tubo: true });
      continue;
    }
    if (!salto && n && n.x - c.x === c.x - p.x && n.y - c.y === c.y - p.y) continue;
    pts.push({ x: c.x * T + 8, y: c.y * T + 13, bajo: salto });
  }
  pts.push({ x: lugar.x, y: lugar.y });
  return pts;
}

function colocar(a, area, texto){
  asignarLugar(a, area);
  a.areaDestino = area; a.textoPendiente = texto;
  a.x = a.lugar.x; a.y = a.lugar.y; a.dir = a.lugar.dir; a.fase = 'trabajando';
  ponerTexto(a, texto, false);
}
function entrar(a, area, texto){
  a.x = COLS * T + 8; a.y = ENTRADA.ty * T + 13; a.dir = 'izq';
  asignarLugar(a, area);
  a.areaDestino = area; a.textoPendiente = texto; a.fase = 'caminando';
  a.ruta = construirRuta(a, { x: ENTRADA.tx, y: ENTRADA.ty }, a.lugar);
  ponerPuntos(a);
}
function irA(a, area, texto){
  const inicio = casillaInicio(a);
  const estabaQuieto = a.fase === 'trabajando';
  asignarLugar(a, area);
  a.areaDestino = area; a.textoPendiente = texto;
  a.ruta = construirRuta(a, inicio, a.lugar);
  if (estabaQuieto){ a.fase = 'aviso'; a.tAviso = AVISO; }
  else if (a.fase !== 'aviso') a.fase = 'caminando';
  ponerPuntos(a);
}
function salir(a){
  const inicio = casillaInicio(a);
  liberar(a);
  a.areaDestino = null; a.zzz = false;
  a.ruta = construirRuta(a, inicio, { tx: ENTRADA.tx, ty: ENTRADA.ty, x: COLS * T + 10, y: ENTRADA.ty * T + 13 });
  a.fase = 'saliendo'; a.modo = 'oculta';
}
function llegar(a){
  if (a.fase === 'saliendo'){ a.el.remove(); a.elNombre.remove(); agentes.delete(a.id); return; }
  a.fase = 'trabajando'; a.dir = a.lugar ? a.lugar.dir : 'abajo'; a.ruta = [];
  if (a.paseo && a.areaDestino === 'descanso') a.paseo.hasta = performance.now() / 1000 + a.paseo.quieto;   // llegó a su punto de paseo
  ponerTexto(a, a.textoPendiente, true);
}

/* ---------- Paseos: quien ya terminó se levanta de vez en cuando a dar una vuelta por la oficina ----------
   Solo los que están en Descanso. Van a un punto del pasillo, se quedan un rato y regresan a su lugar. */
const PRISA = new URLSearchParams(location.search).has('prisa') ? 0.08 : 1;   // ?prisa = paseos seguidos, para probar
const MAX_PASEANDO = 3;
let PUNTOS_PASEO = [[5, 11, 'arriba'], [12, 12, 'abajo'], [19, 11, 'arriba'], [27, 12, 'abajo'], [9, 24, 'abajo'], [20, 23, 'arriba'], [27, 24, 'abajo'],
  [13, 46, 'der'], [18, 52, 'izq'], [12, 55, 'der'], [19, 48, 'izq'], [8, 40, 'abajo'], [22, 39, 'arriba'], [10, 61, 'abajo'], [21, 62, 'abajo'],
  [23, 18, 'abajo'], [28, 16, 'arriba'], [21, 19, 'abajo'], [14, 31, 'abajo'], [15, 34, 'abajo']];
const entre = (a, b) => a + Math.random() * (b - a);
const esperaPaseo = a => (a.callado ? entre(150, 420) : entre(40, 130)) * PRISA;   // los dormidos pasean menos
function pasear(){
  const ahora = performance.now() / 1000;
  let paseando = 0; const tomados = new Set();
  for (const a of agentes.values()) if (a.paseo){ paseando++; tomados.add(a.lugar ? a.lugar.ty * COLS + a.lugar.tx : -1); }
  for (const a of agentes.values()){
    if (a.paseo){
      if (a.areaDestino !== 'descanso' || a.fase === 'saliendo'){ a.paseo = null; continue; }   // le llegó trabajo: ya va a su cuarto
      if (a.fase === 'trabajando' && ahora >= a.paseo.hasta){                                    // ya miró un rato: regresa a Descanso
        const inicio = casillaInicio(a);
        asignarLugar(a, 'descanso');
        a.ruta = construirRuta(a, inicio, a.lugar); a.fase = 'caminando'; a.modo = 'oculta';
        a.paseo = null; a.proximoPaseo = ahora + esperaPaseo(a);
      }
      continue;
    }
    if (!(a.areaDestino === 'descanso' && a.fase === 'trabajando' && a.lugar)){ a.proximoPaseo = 0; continue; }
    if (!a.proximoPaseo){ a.proximoPaseo = ahora + esperaPaseo(a) * (0.3 + Math.random()); continue; }
    if (ahora < a.proximoPaseo || paseando >= MAX_PASEANDO) continue;
    const libres = PUNTOS_PASEO.filter(p => !tomados.has(p[1] * COLS + p[0]));
    if (!libres.length) continue;
    const [tx, ty, dir] = libres[Math.floor(Math.random() * libres.length)];
    const inicio = casillaInicio(a);
    liberar(a);
    EXTRA.descanso.set(a.id, { tx, ty });
    a.lugar = { area: 'descanso', idx: -1, tx, ty, x: tx * T + 8, y: ty * T + 13, dir, sentado: false, silla: null };
    a.ruta = construirRuta(a, inicio, a.lugar); a.fase = 'caminando'; a.modo = 'oculta';
    a.paseo = { hasta: Infinity, quieto: entre(8, 20) * Math.max(PRISA, 0.3) };
    paseando++; tomados.add(ty * COLS + tx);
  }
}
function moverAgente(a, dt){
  if (a.fase === 'aviso'){ a.tAviso -= dt; if (a.tAviso <= 0) a.fase = 'caminando'; return; }
  if (a.fase !== 'caminando' && a.fase !== 'saliendo') return;
  let resto = VELOCIDAD * dt * (a.ruta[0] && a.ruta[0].tubo ? 2.4 : 1);   // por el periférico va más rápido
  while (resto > 0 && a.ruta.length){
    const p = a.ruta[0], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0.01) a.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'izq' : 'der') : (dy < 0 ? 'arriba' : 'abajo');
    if (d <= resto){ a.x = p.x; a.y = p.y; resto -= d; a.recorrido += d; a.ruta.shift(); }
    else { a.x += dx / d * resto; a.y += dy / d * resto; a.recorrido += resto; resto = 0; }
  }
  a.bajo = !!(a.ruta[0] && a.ruta[0].bajo); a.viaja = !!(a.ruta[0] && a.ruta[0].tubo);
  if (!a.ruta.length) llegar(a);
}

/* ---------- Leer estado.json ---------- */
let primeraLectura = true, ultimosDatos = null, ultimaOK = 0, fallos = 0, leyendo = false, ultimoReporte = 0;
function fecha(s){ if (!s) return null; const v = Date.parse(s); return isNaN(v) ? null : v; }

function procesar(datos){
  const ahora = Date.now();
  if (datos && Array.isArray(datos.visitas)) VISITAS_DEMO = datos.visitas;
  const conPase = Object.assign({}, datos, { agentes: conVisitas(datos && datos.agentes, EN_CLAUDE && !DEMO ? VISITAS : VISITAS_DEMO, ahora) });   // + las que entraron con pase
  const lista = aplicarReglas(configActiva(), conPase, ahora).agentes;   // supervisores fijos + visitantes sin vencer
  if (datos && Array.isArray(datos.monitos)) MONITOS_DEMO = datos.monitos;
  if (datos && Array.isArray(datos.avisos)) AVISOS_DEMO = datos.avisos;
  if (datos && Array.isArray(datos.envios)) ENVIOS_DEMO = datos.envios;
  organizarEquipos(lista, ahora);                                     // quién manda a quién ahorita
  for (const m of monitosTodos()) lista.push(registroProgramado(m, ahora));   // monitos con tarea programada: siempre están
  const raizTs = fecha(datos && datos.actualizado);
  ARCHIVOS = Array.isArray(datos && datos.archivos_recientes) ? datos.archivos_recientes.filter(f => f && f.nombre) : [];
  let masReciente = raizTs || 0;
  const vistos = new Set();
  for (const r of lista){
    if (!r || typeof r !== 'object') continue;
    const id = String(r.id ?? r.nombre ?? '').trim().toLowerCase();
    if (!id || vistos.has(id)) continue;
    vistos.add(id);
    let a = agentes.get(id);
    const nuevo = !a;
    if (nuevo){ a = crearAgente(id, r); agentes.set(id, a); }
    const nombreVisible = String(r.nombre || '').trim() || (id.charAt(0).toUpperCase() + id.slice(1));
    const modelo = String(r.modelo || '').toLowerCase();
    a.modelo = MODELOS[modelo] ? modelo : null;
    a.tableta = esTableta(r);
    a.encargo = r.encargo || ''; a.casa = r.casa || '';
    a.rol = r.rol; a.vence = r.vence || 0; a.seVaPronto = !!r.se_va_pronto; a.monito = r.monito || ''; a.enTarea = !!r.tarea; a.plan = r.plan || '';
    a.sesionId = String(r.sesion_id || r.id || ''); a.tePide = r.te_pide || ''; a.loUltimo = r.lo_ultimo || '';
    a.sesionNombre = r.sesion_nombre || ''; a.sesionesExtra = r.sesiones_extra || 0; a.proyecto = r.proyecto || '';
    a.persona = r.persona || (a.tableta ? 'Alberto Terrazas' : 'Calleros');
    a.dispositivo = r.equipo ? String(r.equipo) : a.tableta ? 'Tableta Android' : (r.dispositivo || r.origen) ? 'Calleros — Laptop' : '';
    a.ultraPedido = String(r.modo || '').toLowerCase() === 'ultra' || !!r.ultra;
    a.esfuerzo = esfuerzoDe(r.esfuerzo);
    const firma = (r.area || '') + '|' + (r.actividad || '') + '|' + (r.actualizado || '');
    if (firma !== a.firma){ a.firma = firma; a.vistoCambio = ahora; }
    const ts = r.ausente ? 0 : (fecha(r.actualizado) ?? raizTs ?? a.vistoCambio);
    if (ts > masReciente) masReciente = ts;
    a.ts = r.ausente ? 0 : (fecha(r.ultima_actividad) ?? ts);
    const aguanta = a.tableta && EN_NUBE ? 420 : SEGUNDOS_INACTIVO;   // lo de la tableta llega por GitHub con varios minutos de retraso
    const inactivo = !r.fijo && (!!r.ausente || (ahora - ts) / 1000 > aguanta);
    a.ausente = !!r.ausente;
    a.callado = a.rol === 'visitante' && inactivo && ahora - a.ts > CALLADO_MIN * 60000;
    let area = normalizarArea(r.area) || 'escritorio';
    // El cuarto de la tableta es de su supervisor y de lo que la tableta reporta ahí; los demás visitantes usan toda la oficina
    const enTerrazas = !r.suelto && ((r.fijo && area === 'terrazas') || (a.tableta && (a.rol === 'supervisor' || area === 'terrazas')));
    if (enTerrazas) area = 'terrazas';
    // La tableta siempre dice "terrazas": mientras trabaja, sale al cuarto que le toca según lo que hace (leer, buscar en internet, pedir ayuda…)
    if (enTerrazas && a.tableta && !inactivo && String(r.estado || '').toLowerCase() === 'trabajando' && !/mensaje/i.test(String(r.actividad || ''))){
      const sale = areaDeTexto(r.actividad);
      if (sale !== 'escritorio') area = sale;
    }
    else if (area === 'terrazas' && !r.suelto) area = 'escritorio';
    let texto = textoBreve(r.actividad);
    const quiereTubo = !!r.tubo || (!!ESTACIONES[area] && ES_DEL_TUNEL.test(String(r.actividad || '')));
    if (inactivo){ area = enTerrazas ? 'terrazas' : 'descanso'; texto = 'Esperando instrucciones'; }   // Terrazas espera en su cuarto
    else if (area === 'descanso' && !texto) texto = 'Esperando instrucciones';
    const cambiaTubo = (quiereTubo && !inactivo && !!ESTACIONES[area]) !== !!a.quiereTubo;
    a.quiereTubo = quiereTubo && !inactivo && !!ESTACIONES[area];
    const estado = inactivo ? 'inactivo' : String(r.estado || 'trabajando').toLowerCase();
    a.elNombre.style.setProperty('--e', ESTADO_COLOR[estado] || ESTADO_COLOR.trabajando);
    a.estadoTxt = estado;
    a.zzz = (area === 'descanso' && (inactivo || estado === 'esperando')) || a.callado;
    a.ultra = a.ultraPedido && !inactivo;
    ponerNombre(a, nombreVisible);
    if (nuevo){ if (primeraLectura) colocar(a, area, texto); else entrar(a, area, texto); }
    else if (a.fase === 'saliendo') irA(a, area, texto);
    else if (area !== a.areaDestino || cambiaTubo) irA(a, area, texto);
    else if (texto !== a.textoPendiente){ a.textoPendiente = texto; if (a.fase === 'trabajando') ponerTexto(a, texto, true); }
  }
  for (const a of agentes.values()) if (!vistos.has(a.id) && a.fase !== 'saliendo') salir(a);
  ultimoReporte = masReciente;
  primeraLectura = false;
}
const esTableta = r => /tableta|android/i.test(String(r.dispositivo || r.origen || ''));
async function leerJSON(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok){ const e = new Error('HTTP ' + r.status); e.codigo = r.status; throw e; }
  return JSON.parse((await r.text()).replace(/^﻿/, ''));
}
/* Junta lo de la laptop (Calleros) con lo de la tableta (Terrazas), sin mezclarlos */
function juntar(base, terr){
  const datos = Object.assign({}, base);
  let agentes = Array.isArray(base.agentes) ? base.agentes.slice() : [];
  let archivos = Array.isArray(base.archivos_recientes) ? base.archivos_recientes.slice() : [];
  const deTableta = terr ? (Array.isArray(terr.agentes) ? terr.agentes : terr.agente ? [terr.agente] : []) : [];
  if (deTableta.length){
    agentes = agentes.filter(a => !esTableta(a)).concat(deTableta);   // una sesión de la tableta = un monito
    archivos = archivos.filter(f => !esTableta(f)).concat(Array.isArray(terr.archivos_recientes) ? terr.archivos_recientes : []);
  }
  datos.agentes = agentes; datos.archivos_recientes = archivos;
  return datos;
}
/* ---------- Tus sesiones de Claude Code, leídas con tu propia cuenta (solo dentro de claude.ai) ----------
   La página solo LEE la lista (conector "Claude Code Remote"); no manda mensajes ni cambia nada. */
const CONECTOR = 'Claude Code Remote';
const PASAJERO = new Set(['server_unavailable', 'upstream_error', 'rate_limited', 'cancelled']);
let mcp = null, mcpListo = false, sesionesCrudas = null, sesionesFalla = '', consultando = false, conModelo = false;
const MODELOS_SESION = new Map();   // id de sesión -> { modelo, visto }
async function consultarSesiones(){
  if (!mcp || consultando || DEMO) return;
  consultando = true;
  try {
    const r = await mcp.callTool(CONECTOR, 'list_sessions', { limit: 50 }, { cache: false });
    const primera = !sesionesCrudas;
    sesionesCrudas = r && r.payload !== undefined ? r.payload : r;
    sesionesFalla = ''; ultimaOK = Date.now(); fallos = 0;
    if (primera){
      leerEstado();
      try { const l = await mcp.listTools(CONECTOR); conModelo = l.servers.some(s => s.tools.some(t => t.name === 'get_session')); } catch (e) { conModelo = false; }
    }
    if (primera) setTimeout(buscarModelos, 3000); else buscarModelos();
  } catch (e) {
    const c = (e && e.code) || 'upstream_error';
    if (PASAJERO.has(c)) fallos++; else sesionesFalla = c;   // lo pasajero se reintenta solo; lo demás espera a que piques el botón
  } finally { consultando = false; pintarConexion(); }
}
async function buscarModelos(){   // de a poquito: máximo 2 por vuelta, y solo de las sesiones que se ven
  if (!conModelo) return;
  const ahora = Date.now(); let n = 0;
  for (const a of agentes.values()){
    if (n >= 2 || a.ausente || a.fase === 'saliendo' || !a.sesionId) continue;
    const g = MODELOS_SESION.get(a.sesionId);
    if (g && (ahora - g.visto < 5 * 60000 || a.estadoTxt !== 'trabajando')) continue;
    n++;
    try {
      const r = await mcp.callTool(CONECTOR, 'get_session', { session_id: a.sesionId }, { cache: false });
      const detalle = r && r.payload !== undefined ? r.payload : r;
      MODELOS_SESION.set(a.sesionId, { modelo: modeloDeRespuesta(detalle), esfuerzo: esfuerzoDeRespuesta(detalle), visto: ahora });
    } catch (e) {
      MODELOS_SESION.set(a.sesionId, { modelo: (g && g.modelo) || null, esfuerzo: (g && g.esfuerzo) || null, visto: ahora });
      if (e && !PASAJERO.has(e.code)){ conModelo = false; return; }
    }
  }
}
function pintarConexion(){
  const caja = $('conexion');
  if (!EN_CLAUDE || DEMO){ caja.style.display = 'none'; return; }
  let texto = '', boton = '';
  if (mcpListo && !mcp) texto = 'Desde esta vista no puedo leer tus sesiones. Abre la oficina en claude.ai o en la app de Claude, con tu cuenta.';
  else if (['approval_required', 'not_in_manifest', 'consent_required', 'not_granted'].includes(sesionesFalla)){
    texto = 'La oficina necesita tu permiso para ver la lista de tus sesiones de Claude Code. Solo las lee; no cambia nada.'; boton = 'Permitir y conectar';
  } else if (['server_not_connected', 'selection_required', 'server_not_found'].includes(sesionesFalla)){
    texto = 'Falta el conector «Claude Code Remote» en tu cuenta. Agrégalo en claude.ai, en Ajustes → Conectores.'; boton = 'Volver a intentar';
  } else if (sesionesFalla === 'needs_reauth'){
    texto = 'Hay que volver a conectar «Claude Code Remote» en claude.ai, en Ajustes → Conectores.'; boton = 'Volver a intentar';
  } else if (sesionesFalla){
    texto = 'No se pudo leer la lista de sesiones (' + sesionesFalla + ').'; boton = 'Volver a intentar';
  }
  $('conexionTexto').textContent = texto;
  $('conexionBoton').textContent = boton; $('conexionBoton').style.display = boton ? '' : 'none';
  caja.style.display = texto ? 'flex' : 'none';
}

  if (!EN_CLAUDE) return;

async function leerEstado(){
  if (location.protocol === 'file:' || leyendo) return;
  leyendo = true;
  try {
    await configLista;
    let datos;
    if (DEMO) datos = estadoDemo();
    else if (EN_CLAUDE){
      if (!sesionesCrudas && !MONITOS.size && !VISITAS.length) return;   // todavía no llega nada
      const deSesiones = estadoDeSesiones(sesionesCrudas || [], Date.now(), id => (MODELOS_SESION.get(id) || {}).modelo || null);
      for (const ag of deSesiones.agentes){ const g = MODELOS_SESION.get(ag.id); if (g && g.esfuerzo) ag.esfuerzo = g.esfuerzo; }
      procesar(deSesiones);
      return;
    }
    else if (EN_NUBE){
      const nube = Object.assign({}, NUBE, CONFIG.nube);
      const [base, terr, mon, relevo] = await Promise.all([leerJSON(nube.estado), leerJSON(nube.terrazas).catch(() => null),
        nube.monitos ? leerJSON(nube.monitos).catch(() => null) : null,
        nube.relevo ? leerJSON(String(nube.relevo).replace(/\/$/, '') + '/estado').catch(() => null) : null]);
      datos = juntar(base, terr);
      datos.monitos = mon && Array.isArray(mon.monitos) ? mon.monitos : MONITOS_DEMO;   // si falla la lectura, se quedan los que ya había
      datos.avisos = mon && Array.isArray(mon.avisos) ? mon.avisos : AVISOS_DEMO;
      datos.envios = mon && Array.isArray(mon.envios) ? mon.envios : ENVIOS_DEMO;
      datos.visitas = mon && Array.isArray(mon.visitas) ? mon.visitas : VISITAS_DEMO;
      if (relevo && Array.isArray(relevo.agentes)){                   // el relevo trae las sesiones de todos lados (ver relevo/INSTALAR.md)
        const ya = new Set(datos.agentes.map(a => String(a.id)));
        datos.agentes = datos.agentes.concat(relevo.agentes.filter(a => a && !ya.has(String(a.id))));
        if (Array.isArray(relevo.archivos_recientes)) datos.archivos_recientes = datos.archivos_recientes.concat(relevo.archivos_recientes);
      }
    } else {
      try { datos = await leerJSON('estado.json'); }
      catch (e) { if (e instanceof SyntaxError) return; throw e; }   // a medio escribir: se ignora esta vuelta
    }
    ultimosDatos = datos; ultimaOK = Date.now(); fallos = 0;
    procesar(datos);
  } catch (e) {
    fallos++;
    if (ultimosDatos) procesar(ultimosDatos);   // aunque no haya señal, aplica la regla de los 60 s
  } finally { leyendo = false; }
}

/* ---------- Viñetas y gafetes (HTML encima del lienzo) ---------- */
function ubicarVinetas(){
  const lista = [];
  // Gafetes: si dos monitos quietos quedan pegados (el sillón de Descanso), el segundo baja un renglón
  const gafetes = [];
  for (const a of agentes.values()){
    if (a.medirNombre){ a.nw = a.elNombre.offsetWidth / escala; a.nh = a.elNombre.offsetHeight / escala; a.medirNombre = false; }
    gafetes.push({ a, x: a.x - a.nw / 2, y: a.y + 1, quieto: a.fase === 'trabajando' });
  }
  gafetes.sort((p, q) => (p.y - q.y) || (p.x - q.x));
  const fijos = [];
  for (const b of gafetes){
    if (b.quieto){
      for (let vuelta = 0; vuelta < 10; vuelta++){
        let choco = false;
        for (const o of fijos) if (b.x < o.x + o.a.nw + 1 && b.x + b.a.nw + 1 > o.x && b.y < o.y + o.a.nh && b.y + b.a.nh > o.y){ b.y = o.y + o.a.nh + 0.5; choco = true; }
        if (!choco) break;
      }
      fijos.push(b);
    }
    b.a.elNombre.style.left = (b.a.x * escala) + 'px';
    b.a.elNombre.style.top = (b.y * escala) + 'px';
    b.a.elNombre.style.display = b.a.bajo ? 'none' : '';
  }
  for (const a of agentes.values()){
    const visible = a.modo !== 'oculta' && !(a.callado && a.fase === 'trabajando') && !a.bajo;
    a.el.style.display = visible ? '' : 'none';
    a.tallo = null;
    if (!visible) continue;
    if (a.medir){ a.bw = a.el.offsetWidth / escala; a.bh = a.el.offsetHeight / escala; a.medir = false; }
    const sentado = a.fase === 'trabajando' && a.lugar && a.lugar.sentado;
    const mm = modeloDe(a);
    const cabeza = Math.round(a.y) - (sentado ? mm.h : mm.h + 2) - (a.ultra ? 10 : 3);
    const izq = Math.max(2, Math.min(W - 2 - a.bw, Math.round(a.x - a.bw / 2)));
    const abajo = cabeza - 5;
    lista.push({ a, izq, abajo, arriba: abajo - a.bh, cabeza });
  }
  // Si dos viñetas chocan, la de más arriba se sube
  lista.sort((p, q) => q.abajo - p.abajo);
  const puestas = [];
  for (const b of lista){
    for (let vuelta = 0; vuelta < 12; vuelta++){
      let choco = false;
      for (const o of puestas){
        if (b.izq < o.izq + o.a.bw + 3 && b.izq + b.a.bw + 3 > o.izq && b.arriba < o.abajo + 6 && b.abajo + 6 > o.arriba){
          b.abajo = o.arriba - 6; b.arriba = b.abajo - b.a.bh; choco = true;
        }
      }
      if (!choco) break;
    }
    if (b.arriba < 2){ const d = 2 - b.arriba; b.arriba += d; b.abajo += d; }
    puestas.push(b);
  }
  for (const b of lista){
    const a = b.a;
    const colaX = Math.max(1, Math.min(a.bw - 8, Math.round(a.x - b.izq - 3.5)));
    a.el.style.left = (b.izq * escala) + 'px';
    a.el.style.top = (b.arriba * escala) + 'px';
    a.elCola.style.left = (colaX * escala) + 'px';
    a.el.style.transformOrigin = ((colaX + 3.5) * escala) + 'px 100%';
    const punta = b.abajo + 4;
    if (punta < b.cabeza - 1) a.tallo = { x: Math.round(b.izq + colaX + 3), y0: punta, y1: b.cabeza - 1 };
  }
}

function hace(seg){
  const s = Math.max(0, Date.now() / 1000 - seg);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;

}

/* Ficha de un monito (solo lectura) */
const NOMBRE_AREA = { escritorio: 'Escritorio', biblioteca: 'Biblioteca', internet: 'Internet', 'sala de juntas': 'Sala de juntas',
                      descanso: 'Descanso', calleros: 'Oficina Calleros', 'cerebro delta': 'Cerebro Delta', terrazas: 'Oficina Terrazas', 'centro de pensado': 'Centro de Pensado', almacen: 'Almacén', noticias: 'Sala de Noticias' };
function fechaCorta(s){
  const v = typeof s === 'number' ? s * (s < 1e12 ? 1000 : 1) : Date.parse(s);
  if (!v || isNaN(v)) return '—';
  return new Date(v).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function listaArchivos(lista){
  if (!lista.length) return '<p class="vacio">Todavía no hay archivos reportados desde la tableta.</p>';
  return lista.slice().sort((p, q) => (Date.parse(q.fecha) || 0) - (Date.parse(p.fecha) || 0)).slice(0, 30).map(f => {
    const borrado = /elimin/i.test(String(f.estado || ''));
    return `<div class="item"><span class="origen ${borrado ? 'borrado' : 'tableta'}">${borrado ? 'ELIMINADO EN TABLETA' : 'TABLETA ANDROID'}</span>${esc(f.nombre)}
      <small>${esc(fechaCorta(f.fecha))}${f.tipo ? ' · ' + esc(f.tipo) : ''}</small></div>`;
  }).join('');
}
/* ---------- Monitos con tarea programada ----------
   Cada uno es una tarea programada de Claude que corre sola (por ejemplo, diario), deja su resumen en la base
   del Artifact y aquí se lee. Nunca se van: viven en su cuarto, salen a trabajar cuando les toca y avisan
   cuando traen resumen nuevo.   monitos/<id> = quién es · monitos/<id>/reportes/<fecha> = sus resúmenes */
const MONITOS = new Map(); let MONITOS_DEMO = [];
const monitosTodos = () => EN_CLAUDE && !DEMO ? [...MONITOS.values()] : MONITOS_DEMO;   // en la web vienen del archivo público de monitos
const monitoPorId = id => monitosTodos().find(m => m.id === id);
function escucharMonitos(db){
  db.collection('monitos').onSnapshot(snap => {
    const vivos = new Set();
    for (const d of snap.docs){
      vivos.add(d.id);
      let m = MONITOS.get(d.id);
      if (!m){
        m = { id: d.id, reportes: [] }; MONITOS.set(d.id, m);
        db.collection('monitos/' + d.id + '/reportes').orderBy('creado', 'desc').limit(30).onSnapshot(rs => {
          m.reportes = rs.docs.map(x => Object.assign({ id: x.id }, x.data()));
        }, () => {});
        db.collection('monitos/' + d.id + '/memoria').onSnapshot(ms => {
          m.memoria = ms.docs.map(x => Object.assign({ id: x.id }, x.data()));
        }, () => {});
      }
      Object.assign(m, d.data(), { id: d.id });
    }
    for (const id of [...MONITOS.keys()]) if (!vivos.has(id)) MONITOS.delete(id);
  }, () => {});
  db.collection('visitas').onSnapshot(vs => { VISITAS = vs.docs.map(x => Object.assign({ id: x.id }, x.data())); }, () => {});
  db.collection('envios').orderBy('creado', 'desc').limit(40).onSnapshot(es => {
    ENVIOS = es.docs.map(x => Object.assign({ id: x.id }, x.data())); revisarEnvios();
  }, () => {});
  db.collection('avisos').onSnapshot(as => {
    AVISOS = as.docs.map(x => Object.assign({ id: x.id }, x.data())).sort((p, q) => String(q.creado || '').localeCompare(String(p.creado || '')));
  }, () => {});
}

/* ---------- Envíos por el túnel ----------
   Un envío = algo que un monito o una sesión le manda a otro cuarto: { de, para, tipo, titulo, texto, autor, creado }.
   Hay dos lugares donde se escriben: el campo "envios" del resumen del día de un monito (salen de su cuarto,
   a la hora de "enviado") y la colección "envios" de la base del Artifact (envíos sueltos de cualquier sesión).
   La oficina no inventa ninguno: el paquete viaja cuando el envío es nuevo, y se queda en el buzón de la estación. */
let ENVIOS = [], ENVIOS_DEMO = [];
let VISITAS = [], VISITAS_DEMO = [];   // sesiones que entraron con pase (colección "visitas")
const VIAJES = [], LLEGO = {}, SIN_LEER = {}, YA_VIAJO = new Set();
const VEL_TUNEL = 60;                 // pixeles por segundo
let tDibujo = 0, primerosEnvios = true, cacheEnvios = null;
function casaDeMonito(quien){
  const q = sinAcentos(quien).toLowerCase().trim();
  const m = q && monitosTodos().find(m => m.id === q || sinAcentos(m.nombre).toLowerCase() === q);
  return m ? m.casa : null;
}
function enviosDeReportes(){   // lo que cada monito mandó al terminar su ronda
  const out = [];
  for (const m of monitosTodos()) for (const r of m.reportes || []) (Array.isArray(r.envios) ? r.envios : []).forEach((e, i) => {
    if (!e || typeof e !== 'object') return;
    const destino = sinAcentos(e.para || String(i)).toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const de = /noticia/i.test(e.tipo || '') ? 'internet' : m.casa;   // las noticias salen de Internet, que es donde las encontró
    out.push(Object.assign({ de, autor: m.nombre || m.id, creado: r.enviado || r.creado }, e, { id: `${m.id}-${r.id}-${destino}` }));
  });
  return out;
}
function juntarEnvios(){ cacheEnvios = enviosLimpios((EN_CLAUDE && !DEMO ? ENVIOS : ENVIOS_DEMO).concat(enviosDeReportes()), casaDeMonito); return cacheEnvios; }
const enviosTodos = () => cacheEnvios || juntarEnvios();   // se vuelve a juntar cada segundo, en revisarEnvios
const BUZON_LEIDO = {};
function leidoBuzon(clave){
  if (BUZON_LEIDO[clave] == null){ let v = 0; try { v = +localStorage.getItem('oficina.buzon.' + clave) || 0; } catch (e) {} BUZON_LEIDO[clave] = v; }
  return BUZON_LEIDO[clave];
}
function marcarBuzon(clave){
  BUZON_LEIDO[clave] = Date.now();
  try { localStorage.setItem('oficina.buzon.' + clave, String(BUZON_LEIDO[clave])); } catch (e) {}
  revisarEnvios();
}
function lanzarViaje(e, espera = 0){
  const ruta = rutaTunel(e.de, e.para); if (!ruta) return;
  VIAJES.push({ e, ruta, largo: largoRuta(ruta), sale: tDibujo + espera });
}
/* Cuenta lo que hay sin leer en cada buzón y echa a andar los paquetes nuevos. Al abrir la oficina también
   repite (una vez) el viaje de lo que llegó en el último día y sigue sin leerse. */
function revisarEnvios(){
  const lista = juntarEnvios(), ahora = Date.now();
  for (const k of Object.keys(ESTACIONES)) SIN_LEER[k] = 0;
  for (const e of lista) if (e.creado > leidoBuzon(e.para)) SIN_LEER[e.para]++;
  const salen = [];
  for (const e of lista){
    if (YA_VIAJO.has(e.id)) continue;
    YA_VIAJO.add(e.id);
    if (ahora - e.creado < 15 * 60000 || (primerosEnvios && ahora - e.creado < 24 * 3600000 && e.creado > leidoBuzon(e.para))) salen.push(e);
  }
  salen.slice(0, 5).reverse().forEach((e, i) => lanzarViaje(e, 1 + i * 4));   // de uno en uno, del más viejo al más nuevo
  if (lista.length || performance.now() > 20000) primerosEnvios = false;
}
const NOMBRE_TIPO = { archivo: 'ARCHIVO', nota: 'NOTA', noticias: 'NOTICIAS', aviso: 'AVISO', dato: 'DATO' };

function panelEstacion(clave){

  html += '<h4 style="margin:16px 0 8px">Últimos envíos</h4>' + (lista.length ? lista.slice(0, 20).map(x => tarjetaEnvio(x, x.creado > leidoBuzon(x.para))).join('') : '<p class="vacio">Todavía no ha viajado nada por el túnel. Los envíos aparecen aquí cuando un monito manda algo.</p>');

/* ---------- Memoria, archivo y cartelera ----------
   Memoria (Centro de Pensado): notas que cada monito lee al empezar su tarea y actualiza al terminar.
   Archivo (Almacén): los resúmenes de cada día.
   Cartelera (Sala de Noticias): todo lo que hay para mostrar; la pantalla cambia cada 5 minutos y una de cada
   dos veces sale una noticia del día. */
let AVISOS = [], AVISOS_DEMO = [];
const avisosTodos = () => EN_CLAUDE && !DEMO ? AVISOS : AVISOS_DEMO;
const notasDeMemoria = () => monitosTodos().reduce((n, m) => n + (m.memoria || []).length, 0);
const diasArchivados = () => monitosTodos().reduce((n, m) => n + (m.reportes || []).length, 0);
const colorSeccion = sec => sec.id === 'oficina' ? '#6fd36f' : (ASPECTOS[sec.aspecto] || ASPECTOS.normal).etiqueta;
const seccionesAhora = () => secciones(monitosTodos(), avisosTodos(), Date.now());
function enPantalla(ahora){   // qué sección toca y qué cosa de ella
  const secs = secciones(monitosTodos(), avisosTodos(), ahora), tn = turnoDe(ahora, 1), t = turnoSeccion(secs, tn.vuelta);

  return Object.assign({ i: t.i, total: sec.items.length, vuelta: tn.vuelta, cambia: tn.cambia, seccion: sec.titulo, sid: sec.id, color: colorSeccion(sec) }, sec.items[t.i]);
}

function panelCartelera(){

}
function panelMemoria(){

function leidoDe(id){ try { return localStorage.getItem('oficina.leido.' + id) || ''; } catch (e) { return ''; } }
function marcarLeido(id, reporte){ try { localStorage.setItem('oficina.leido.' + id, reporte); } catch (e) {} }
/* Entre tarea y tarea no se queda quieto: cada pocos minutos cambia de plan. A veces hace algo por su cuenta
   (su "rutina"), a veces se queda en su lugar y a veces se va a Descanso, donde también se pasea. Todos los
   que ven la oficina lo ven hacer lo mismo, porque el plan sale del reloj. */
const RATO_MIN = 4;
/* ---------- Horario de la oficina ----------
   Dentro del horario, los jefes mandan a sus agentes y cada quien hace lo suyo. Fuera de él, todos descansan, se
   pasean o acomodan cosas, y la oficina se ve de noche, con sus lámparas prendidas. Lo que una sesión o una tarea
   programada hace de verdad se muestra siempre, a la hora que sea. Va con la hora de este aparato. */
let HORARIO = { abre: '06:00', cierra: '19:30' }, dbHorario = null, nochePrueba = 0;
const aMinutos = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1] % 24) * 60 + (+m[2] % 60) : null; };
const horarioValido = h => !!h && aMinutos(h.abre) != null && aMinutos(h.cierra) != null && aMinutos(h.abre) !== aMinutos(h.cierra);
try { const h = JSON.parse(localStorage.getItem('oficina.horario') || 'null'); if (horarioValido(h)) HORARIO = { abre: h.abre, cierra: h.cierra }; } catch (e) {}
function abierta(ahora){
  const d = new Date(ahora), min = d.getHours() * 60 + d.getMinutes(), a = aMinutos(HORARIO.abre), c = aMinutos(HORARIO.cierra);
  return a < c ? min >= a && min < c : min >= a || min < c;     // también sirve si cierra pasada la medianoche
}
const horaBonita = t => { const m = aMinutos(t), h = Math.floor(m / 60), x = m % 60; return `${h % 12 || 12}:${String(x).padStart(2, '0')} ${h < 12 ? 'a.m.' : 'p.m.'}`; };
function ponerHorario(h, guardar){
  if (!horarioValido(h)) return false;
  HORARIO = { abre: h.abre, cierra: h.cierra };
  if (guardar){
    try { localStorage.setItem('oficina.horario', JSON.stringify(HORARIO)); } catch (e) {}
    if (dbHorario) dbHorario.set(HORARIO).catch(() => {});
  }
  return true;
}
function planDeNoche(casa, quien, ahora){   // fuera de horario: descansar, pasearse (los de Descanso se pasean solos) o acomodar cosas
  const eq = EQUIPOS.find(e => e.casa === casa);
  const lista = eq ? eq.noche : [[casa || 'descanso', 'Acomodando sus cosas'], ['descanso', 'Descansando'], ['descanso', 'Descansando']];
  const p = lista[Math.floor(azar(Math.floor(hashTexto(String(quien)) * 1e9) + Math.floor(ahora / (2 * RATO_MIN * 60000)) * 7919)() * lista.length)];
  return { area: p[0], actividad: p[1], noche: true };
}
const ES_DEL_TUNEL = /t[uú]nel|buz[oó]n/i;   // lo que se hace en la estación del túnel
function ratoLibre(m, ahora){
  if (!abierta(ahora)) return planDeNoche(m.casa, m.id, ahora);
  const propia = (Array.isArray(m.rutina) ? m.rutina : []).filter(x => x && x.area);
  const planes = propia.concat(propia, [{ area: m.casa || 'descanso', actividad: '' }, { area: 'descanso', actividad: 'Descansando un rato' }, { area: 'descanso', actividad: 'Descansando un rato' }]);
  const x = enPantalla(ahora);                                       // cada 20 minutos se para un rato junto a la pantalla a presentar su noticia
  if (x && x.noticia && x.vuelta % 3 === 0 && ahora % CADA_PANTALLA < 150000 && x.sid === m.id)
    return { area: 'noticias', actividad: '', plan: 'Presentando en la pantalla: ' + (x.titulo || '') };   // sin viñeta: la pantalla ya lo dice
  const turno = Math.floor(ahora / (RATO_MIN * 60000));
  return planes[Math.floor(azar(Math.floor(hashTexto(m.id) * 1e9) + turno * 7919)() * planes.length)];   // azar() revuelve bien turnos seguidos
}
/* Equipos. Cada supervisor de casa es el jefe de los monitos que viven en su cuarto:
     DragTree  -> Oficina Terrazas y Centro de Pensado · su agente es Nitro (y Pole)
     Calleros  -> Oficina Calleros y Cerebro Delta      · su agente es el que viva en la Oficina Calleros
   Dos cosas distintas:
   1. De verdad: cuando la sesión del jefe trabaja y usa un ayudante (subagente), ese trabajo lo hace su agente en
      la oficina. Si el aviso de la sesión dice qué hace el ayudante (ayudante_actividad), el agente hace eso mismo
      en el cuarto que toca; si solo se sabe que pidió ayuda, el agente se va con él a ayudarle.
   2. De ambiente: mientras la sesión del jefe espera, no se queda quieto: revisa lo suyo, se pasea y le da
      instrucciones a su agente o lo manda a un cuarto. Sale del reloj, no de la sesión. */
const EQUIPOS = [
  { casa: 'terrazas', es: r => esTableta(r) || /dragtree|terrazas/i.test(sinAcentos(r.nombre)),
    solo: [['terrazas', 'Revisando el trabajo del equipo'], ['terrazas', 'Probando el árbol de luces'], ['centro de pensado', 'Revisando la memoria del equipo'], ['almacen', 'Revisando el archivo'],
           ['noticias', 'Revisando el noticiero'], ['descanso', 'Tomando un café'], ['internet', 'Viendo cómo va la competencia']],
    noche: [['terrazas', 'Acomodando la oficina'], ['almacen', 'Acomodando el archivo'], ['centro de pensado', 'Apagando la compu'], ['descanso', 'Descansando'], ['descanso', 'Descansando'], ['descanso', 'Descansando']],
    encargos: [['internet', 'busca qué hay de nuevo', 'Buscando lo que pidió el jefe'], ['biblioteca', 'revisa el reglamento', 'Revisando lo que pidió el jefe'],
               ['noticias', 'checa cómo se ve el noticiero', 'Revisando el noticiero para el jefe'], ['centro de pensado', 'ordena tus notas', 'Ordenando mis notas para el jefe']] },
  { casa: 'calleros', es: r => /calleros/i.test(sinAcentos(String(r.nombre || '') + ' ' + String(r.id || ''))),
    solo: [['calleros', 'Revisando pendientes'], ['calleros', 'Firmando papeles'], ['cerebro delta', 'Consultando el Cerebro'], ['cerebro delta', 'Revisando las notas del Cerebro'],
           ['sala de juntas', 'Preparando la junta'], ['biblioteca', 'Hojeando un libro'], ['escritorio', 'Viendo cómo va el trabajo'], ['internet', 'Leyendo las noticias'],
           ['noticias', 'Viendo el noticiero'], ['descanso', 'Tomando un café']],
    noche: [['calleros', 'Acomodando la oficina'], ['cerebro delta', 'Acomodando notas del Cerebro'], ['biblioteca', 'Acomodando libros'], ['descanso', 'Descansando'], ['descanso', 'Descansando'], ['descanso', 'Descansando']],
    encargos: [['cerebro delta', 'busca esto en el Cerebro', 'Buscando en el Cerebro para el jefe'], ['biblioteca', 'tráeme ese libro', 'Buscando el libro que pidió el jefe'],
               ['internet', 'investiga esto', 'Investigando lo que pidió el jefe'], ['calleros', 'ordena estos papeles', 'Ordenando papeles para el jefe']] },
];
const PLANES = new Map();   // casa del equipo -> lo que hace el jefe ahorita y, si hay, a quién manda
const enSuTarea = (m, ahora) => m.estado === 'trabajando' && ahora - (fecha(m.actualizado) || 0) < 30 * 60000;
const deEquipo = eq => monitosTodos().filter(m => (m.casa || '') === eq.casa);
function planDeJefe(eq, ahora){   // de ambiente
  if (!abierta(ahora)) return planDeNoche(eq.casa, 'jefe-' + eq.casa, ahora);   // fuera de horario no manda a nadie
  const r = azar(424242 + Math.floor(hashTexto(eq.casa) * 1e6) + Math.floor(ahora / (RATO_MIN * 60000)) * 104729);
  const libres = deEquipo(eq).filter(m => !enSuTarea(m, ahora) && !ratoLibre(m, ahora).plan);
  const tiro = r(), m = libres.length ? libres[Math.floor(r() * libres.length)] : null, cual = r();
  if (m && tiro < 0.3){
    const pend = ((m.memoria || []).find(x => x.id === 'pendientes') || {}).texto;
    const primero = String(pend || '').split('\n').map(l => l.replace(/^[-•\s]+/, '').trim()).filter(Boolean)[0];
    return { area: eq.casa, actividad: `${m.nombre || m.id}: ${primero ? 'dale seguimiento a ' + primero.charAt(0).toLowerCase() + primero.slice(1) : '¿qué traes para hoy?'}`, monito: m.id,
      orden: { area: eq.casa, actividad: 'Recibiendo instrucciones del jefe' } };
  }
  if (m && tiro < 0.6){
    const d = eq.encargos[Math.floor(cual * eq.encargos.length)];
    return { area: eq.casa, actividad: `${m.nombre || m.id}, ${d[1]}`, monito: m.id, orden: { area: d[0], actividad: d[2] } };

function encargoReal(eq, jefe, ahora){   // de verdad: la sesión del jefe está usando un ayudante
  const hace = String(jefe.ayudante_actividad || ''), visto = fecha(jefe.ayudante_visto) || fecha(jefe.actualizado) || 0;
  const pide = /ayudante|agente|subagent|deleg/i.test(String(jefe.actividad || '')) || normalizarArea(jefe.area) === 'sala de juntas';
  if (!(hace && ahora - visto < 8 * 60000) && !pide) return null;
  const m = deEquipo(eq).find(x => !enSuTarea(x, ahora));
  if (!m) return null;
  const orden = hace ? { area: normalizarArea(jefe.ayudante_area) || areaDeTexto(hace), actividad: hace } : { area: 'sala de juntas', actividad: 'Ayudando a ' + (jefe.nombre || 'su jefe') };
  if (orden.area === 'escritorio' && hace) orden.area = eq.casa;        // lo de escritorio lo hace en la oficina de su equipo
  return { real: true, monito: m.id, orden, jefe: jefe.nombre || '' };
}
function organizarEquipos(lista, ahora){
  PLANES.clear();
  const tomados = new Set();
  for (const eq of EQUIPOS){
    const jefe = lista.find(r => r.rol === 'supervisor' && !tomados.has(r) && eq.es(r));
    if (!jefe) continue;
    tomados.add(jefe);
    jefe.casa = eq.casa;
    const fresco = !jefe.ausente && ahora - (fecha(jefe.actualizado) || 0) < (EN_NUBE ? 420000 : SEGUNDOS_INACTIVO * 1000);
    if (fresco && String(jefe.estado || '').toLowerCase() === 'trabajando'){
      const real = encargoReal(eq, jefe, ahora);
      if (real){
        PLANES.set(eq.casa, real);
        if (jefe.ayudante_actividad && !/ayudante|agente/i.test(String(jefe.actividad || ''))) jefe.actividad = 'Coordinando a ' + ((monitoPorId(real.monito) || {}).nombre || 'su agente');
      }
      continue;
    }
    const plan = planDeJefe(eq, ahora);
    PLANES.set(eq.casa, plan);
    Object.assign(jefe, { area: plan.area, actividad: plan.actividad, plan: plan.actividad, estado: plan.noche && plan.area === 'descanso' ? 'esperando' : 'por su cuenta', fijo: true, suelto: true,
      ultima_actividad: jefe.ultima_actividad || jefe.actualizado, actualizado: new Date(ahora).toISOString() });
  }
}
function registroProgramado(m, ahora){
  const visto = fecha(m.actualizado) || 0;
  const trabajando = m.estado === 'trabajando' && ahora - visto < 30 * 60000;       // si la tarea se cayó, no se queda "trabajando" para siempre
  const ultimo = (m.reportes || [])[0], nuevo = !!ultimo && leidoDe(m.id) !== ultimo.id;
  const frases = Array.isArray(m.frases) ? m.frases : [];
  const seg = ahora / 1000, frase = frases.length && seg % 50 < 9 ? frases[Math.floor(seg / 50) % frases.length] : '';   // de vez en cuando dice algo suyo
  const suelto = ratoLibre(m, ahora);
  const plan = PLANES.get(m.casa || ''), mio = !!plan && plan.monito === m.id && !trabajando && (plan.real || !suelto.plan);
  const orden = mio ? plan.orden : null;                             // lo que le encargó su jefe
  const libre = orden ? { area: orden.area, actividad: orden.actividad, orden: true, real: !!plan.real } : suelto;
  const enEstacion = !trabajando && ES_DEL_TUNEL.test(libre.actividad || '');   // en la estación dice lo que hace ahí
  return {
    id: 'monito-' + m.id, monito: m.id, nombre: m.nombre || m.id, rol: 'programado', fijo: true,
    area: trabajando ? (m.area || 'internet') : libre.area,
    actividad: trabajando ? (m.actividad || 'Trabajando') : libre.plan ? '' : (enEstacion || libre.orden) ? libre.actividad : nuevo ? '¡Traigo resumen nuevo!' : (frase || libre.actividad || ''),
    estado: trabajando || libre.real ? 'trabajando' : libre.area === 'descanso' ? 'esperando' : (libre.actividad || libre.plan) ? 'por su cuenta' : nuevo ? 'terminado' : 'esperando',
    tarea: trabajando, encargo: libre.real ? plan.jefe : '', plan: trabajando ? '' : (libre.plan || libre.actividad || 'En su lugar'),
    tubo: enEstacion || (trabajando && ES_DEL_TUNEL.test(m.actividad || '')),
    modelo: m.modelo, esfuerzo: m.esfuerzo, aspecto: m.aspecto, equipo: m.horario || (m.jefe ? 'Agente de ' + m.jefe : 'Tarea programada'),

}

function fichaMonito(a, cual){

/* El mouse: letrerito al pasar y clic para abrir */
const tip = $('tip');
let zonaEncima = null;
function aLogico(ev){ const r = lienzo.getBoundingClientRect(); return { x: (ev.clientX - r.left) / escala, y: (ev.clientY - r.top) / escala }; }
function agenteEn(p){
  let mejor = null;
  for (const a of agentes.values()){
    if (a.fase === 'saliendo' || a.bajo) continue;
    const m = modeloDe(a);
    const holgura = 3 + 14 / escala;   // con el dedo se atina más fácil
    if (Math.abs(p.x - a.x) <= m.w / 2 + holgura && p.y <= a.y + holgura && p.y >= a.y - m.h - 6 - holgura) mejor = a;
  }
  return mejor;
}
function zonaEn(p){
  let mejor = null;
  for (const z of ZONAS) if (p.x >= z.x && p.x < z.x + z.w && p.y >= z.y && p.y < z.y + z.h && (!mejor || z.w * z.h < mejor.w * mejor.h)) mejor = z;
  return mejor;
}
lienzo.addEventListener('mousemove', ev => {
  const p = aLogico(ev), a = agenteEn(p), z = a ? null : zonaEn(p);
  zonaEncima = z;
  const titulo = a ? `${a.nombre} — ver ficha` : z ? (typeof z.titulo === 'function' ? z.titulo() : z.titulo) : '';
  lienzo.style.cursor = titulo ? 'pointer' : 'default';
  tip.style.display = titulo ? 'block' : 'none';
  if (titulo){ tip.textContent = titulo; tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (ev.clientY + 16) + 'px'; }
});
lienzo.addEventListener('mouseleave', () => { tip.style.display = 'none'; zonaEncima = null; });
lienzo.addEventListener('click', ev => {
  const p = aLogico(ev), a = agenteEn(p);
  if (a) return fichaAgente(a);
  const z = zonaEn(p);
  if (z) z.accion();
});

    <p class="meta" id="horAviso" style="margin-top:10px">${esc(aviso || (EN_CLAUDE && !DEMO ? 'El horario se guarda para todos los que abren esta vista.' : 'En la página web el horario se guarda en este aparato.'))}</p>`);
  $('horGuardar').addEventListener('click', () => {

}

/* Ir de piso en piso */
const irAFila = fila => escenario.scrollTo({ top: Math.max(0, fila * T * escala), behavior: 'smooth' });

}

/* Zoom: pellizco con dos dedos (o Ctrl + rueda en la compu). Solo cambia cómo se VE. */
let pinza = null;
function zoomEn(nuevo, cx, cy){
  const r = escenario.getBoundingClientRect();
  const px = (escenario.scrollLeft + cx - r.left) / escala, py = (escenario.scrollTop + cy - r.top) / escala;
  zoom = Math.max(1, Math.min(4, nuevo));
  ajustarEscala();
  escenario.style.scrollBehavior = 'auto';
  escenario.scrollLeft = px * escala - (cx - r.left); escenario.scrollTop = py * escala - (cy - r.top);
  escenario.style.scrollBehavior = '';
  $('zoomTip').style.display = 'none';
}
const distancia = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
escenario.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinza = { d: distancia(e.touches), z: zoom };
}, { passive: true });
escenario.addEventListener('touchmove', e => {
  if (!pinza || e.touches.length !== 2) return;
  e.preventDefault();
  const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  zoomEn(pinza.z * distancia(e.touches) / pinza.d, cx, cy);
}, { passive: false });
escenario.addEventListener('touchend', e => { if (e.touches.length < 2) pinza = null; });
escenario.addEventListener('wheel', e => { if (e.ctrlKey){ e.preventDefault(); zoomEn(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); } }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());   // iPhone: que no haga zoom a toda la página

/* ---------- Dibujo ---------- */
function dibujar(t){
  g = ctx;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(estatica, 0, 0);
  enBandas(() => paredesAnimadas(t));
  ancho(t);
  dibujarViajes(t);            // lo que va por el periférico
  const items = MUEBLES.slice();
  for (const a of agentes.values()) items.push({ sortY: a.y, a });
  items.sort((p, q) => p.sortY - q.sortY);
  for (const it of items){ if (!it.a) it.dibujar(t); else if (!it.a.bajo) dibujarAgente(it.a, t); }
  tallos();
  noche();
  if (zonaEncima){   // marco punteado sobre lo que se puede picar
    const z = zonaEncima, c = Math.floor(t * 4) % 2 ? '#ffe066' : '#fff6c2';
    for (let i = 0; i < z.w; i += 4){ R(z.x + i, z.y, 2, 1, c); R(z.x + i, z.y + z.h - 1, 2, 1, c); }
    for (let i = 0; i < z.h; i += 4){ R(z.x, z.y + i, 1, 2, c); R(z.x + z.w - 1, z.y + i, 1, 2, c); }
  }
}
/* ---------- De noche: la oficina se oscurece y quedan prendidas las lámparas de pasillos y cuartos ---------- */
let capaNoche = null, nivelNoche = 0;
function lamparas(){   // [x, y, alcance] en pixeles de ahora
  const L = [];
  for (const y of [208, 432, 704, 1056]) for (let x = 56; x < W; x += 80) L.push([x, y, y === 704 || y === 1056 ? 46 : 58]);          // pasillos
  for (const y of [536, 632]) L.push([240, y, 44]);                                                                                 // entre Calleros y el Cerebro
  for (const y of [800, 912, 1000]){ L.push([200, y, 50]); L.push([312, y, 50]); }                                                  // gran pasillo, a los lados del túnel
  for (const [nombre, A] of Object.entries(AREAS)){                                                                                 // cada cuarto
    if (nombre === 'almacen') continue;
    const cx = (A.x0 + A.x1 + 1) / 2 * T, cy = (A.y0 + A.y1 + 1) / 2 * T, ancho = (A.x1 - A.x0 + 1) * T, alto = (A.y1 - A.y0 + 1) * T;
    if (alto > 200){ L.push([cx, cy - alto / 4, 74]); L.push([cx, cy + alto / 4, 74]); }
    else if (ancho > 170){ L.push([cx - ancho / 4, cy, 70]); L.push([cx + ancho / 4, cy, 70]); }
    else L.push([cx, cy, 72]);
  }
  for (const x of [88, 256, 424]) L.push([x, 73 * T, 50]);                                                                           // espacios libres: una sola, más tenue
  for (const x of [120, 256, 400]) L.push([x, 85 * T, 56]);                                                                          // Ampliación: lámparas de obra
  return L;
}
function armarNoche(){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), L = lamparas();
  x.fillStyle = 'rgb(7,9,28)'; x.globalAlpha = 0.66; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'destination-out';                     // cada lámpara abre su charco de luz, en tres escalones
  for (const [lx, ly, r] of L) for (const [f, a] of [[1, 0.3], [0.72, 0.36], [0.44, 0.5]]){ x.globalAlpha = a; x.beginPath(); x.arc(lx, ly, r * f, 0, 7); x.fill(); }
  x.globalCompositeOperation = 'source-over';
  for (const [lx, ly, r] of L){                                       // luz cálida y la lámpara misma
    x.globalAlpha = 0.1; x.fillStyle = '#ffd27a'; x.beginPath(); x.arc(lx, ly, r * 0.72, 0, 7); x.fill();
    x.globalAlpha = 1; x.fillStyle = K; x.fillRect(Math.round(lx) - 3, Math.round(ly) - 2, 6, 4);
    x.fillStyle = '#ffe9a0'; x.fillRect(Math.round(lx) - 2, Math.round(ly) - 1, 4, 2);
  }
  return c;
}
function noche(){
  const ahora = Date.now(), meta = !abierta(ahora) || ahora < nochePrueba ? 1 : 0;
  nivelNoche += (meta - nivelNoche) * 0.04;                           // se prende y se apaga poco a poco
  if (Math.abs(meta - nivelNoche) < 0.01) nivelNoche = meta;
  if (nivelNoche <= 0) return;
  if (!capaNoche) capaNoche = armarNoche();
  ctx.globalAlpha = nivelNoche; ctx.drawImage(capaNoche, 0, 0); ctx.globalAlpha = 1;
}
let anterior = 0;
function bucle(ms){
  requestAnimationFrame(bucle);
  if (anterior && ms - anterior < 1000 / FPS - 2) return;
  const dt = anterior ? Math.min(1, (ms - anterior) / 1000) : 0;   // según el reloj real, aunque el navegador vaya lento
  anterior = ms;
  pasear();
  for (const a of [...agentes.values()]) moverAgente(a, dt);
  letrerosActivos();
  ubicarVinetas();
  dibujar(ms / 1000);
}
